<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário, Izadora!</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            font-family: 'Playfair Display', serif;
            color: #fff;
        }

        /* Fundo com estrelas cintilantes */
        #stars-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 5px #fff; }
        }

        /* Canvas dos Fogos */
        canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        /* Container Central (Texto e Botão) */
        #content-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* Efeito Máquina de Escrever */
        .message-wrapper {
            font-size: 2.5rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 25px #d4af37;
            margin: 0;
            font-weight: normal;
            min-height: 80px; /* Evita que o layout pule */
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #d4af37;
            margin-left: 5px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Botão Abrir Presente */
        #start-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #d4af37;
            color: #d4af37;
            padding: 12px 35px;
            font-size: 1.2rem;
            font-family: 'Playfair Display', serif;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none; /* Desativado até aparecer */
        }

        #start-btn.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.4); }
            100% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.9); }
        }

        #start-btn:hover {
            background: #d4af37;
            color: #000;
            box-shadow: 0 0 30px rgba(212, 175, 55, 1);
        }

        #youtube-container {
            display: none;
        }
    </style>
</head>
<body>

    <div id="stars-container"></div>
    <canvas id="fireworks"></canvas>

    <div id="content-container">
        <div class="message-wrapper">
            <span id="text"></span><span class="cursor" id="cursor">&nbsp;</span>
        </div>
        <button id="start-btn">Abrir Presente</button>
    </div>

    <!-- Container onde o vídeo será injetado para forçar o autoplay no celular após o clique -->
    <div id="youtube-container"></div>

    <script>
        // ==========================================
        // ESTRELAS CINTILANTES NO FUNDO
        // ==========================================
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 150; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDuration = (Math.random() * 3 + 1) + 's';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }

        // ==========================================
        // MÁQUINA DE ESCREVER
        // ==========================================
        const fullText = "Feliz Aniversário, Izadora Voguel!";
        const textElement = document.getElementById("text");
        const startBtn = document.getElementById("start-btn");
        let textIndex = 0;

        function typeWriter() {
            if (textIndex < fullText.length) {
                textElement.innerHTML += fullText.charAt(textIndex);
                textIndex++;
                // Variação de tempo para parecer digitação real
                let typingSpeed = Math.random() * 100 + 50; 
                setTimeout(typeWriter, typingSpeed);
            } else {
                // Terminou de digitar: mostra o botão suavemente
                setTimeout(() => {
                    startBtn.classList.add('visible');
                }, 800);
            }
        }

        // ==========================================
        // LÓGICA DO CLIQUE E MÚSICA
        // ==========================================
        let fireworkIntensity = 0.03; // Intensidade inicial dos fogos

        startBtn.addEventListener("click", function() {
            // Esconde o botão após clicar
            startBtn.style.opacity = "0";
            startBtn.style.pointerEvents = "none";
            
            // Aumenta a quantidade de fogos
            fireworkIntensity = 0.15;

            // Injeta o iframe do YouTube com autoplay (ID da música Måneskin - CORALINE)
            const ytContainer = document.getElementById('youtube-container');
            ytContainer.innerHTML = '<iframe width="10" height="10" src="https://www.youtube.com/embed/CmMO42bOTZ4?autoplay=1&enablejsapi=1" frameborder="0" allow="autoplay; encrypted-media"></iframe>';
        });

        // ==========================================
        // FOGOS DE ARTIFÍCIO REALISTAS
        // ==========================================
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const colors = ['#d4af37', '#ffb6c1', '#ffffff', '#ffdf00', '#ff4500', '#8a2be2', '#00ffff'];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 2 + 1;
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * velocity;
                this.vy = Math.sin(angle) * velocity;
                this.friction = 0.96; // Resistência do ar
                this.gravity = 0.04;  // Caimento da faísca
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.005; // Tempo que a faísca dura
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
        }

        function createFirework(x, y) {
            const particleCount = 120;
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            // Efeito de rastro (trail) nos fogos
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Chance de criar um novo fogo de artifício a cada frame
            if (Math.random() < fireworkIntensity) {
                createFirework(
                    Math.random() * canvas.width, 
                    Math.random() * (canvas.height * 0.6) // Estoura mais na parte de cima da tela
                );
            }

            particles.forEach((particle, index) => {
                if (particle.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    particle.update();
                    particle.draw();
                }
            });
        }

        // Ajustar redimensionamento de tela do celular
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // INICIAR TUDO AO CARREGAR A PÁGINA
        window.onload = () => {
            animate(); // Começa os fogos suaves
            setTimeout(typeWriter, 1000); // Espera 1 segundo e começa a digitar
        };
    </script>
</body>
</html>
